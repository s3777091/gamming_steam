name: iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner (Intel fallback when ARM capacity is constrained)
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
  push:
    branches: [feat/theme-system]
    # Sửa tài liệu thì không cần .ipa mới.
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.vscode/**'

# Push liên tiếp thì chỉ giữ lần cuối — mỗi run bị huỷ sớm là 70 phút quota
# không bị đốt. Build cũ đằng nào cũng lỗi thời ngay khi có commit mới.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Thoát nhanh cho commit không đáng build: ghi [skip ipa] trong message.
    #
    # BẪY: điều kiện này quét toàn bộ message, kể cả phần thân. Commit nào NHẮC
    # TỚI chuỗi đó — ví dụ commit tài liệu hoá chính cái cờ này — cũng bị bỏ qua.
    # Muốn nói về nó trong message thì viết tách ra, đừng viết liền nguyên chuỗi.
    #
    # workflow_dispatch không có head_commit; contains(null, …) = false nên
    # bấm tay luôn chạy, không bao giờ bị cờ này chặn.
    if: "!contains(github.event.head_commit.message, '[skip ipa]')"
    # macos-15 mang Xcode Swift 6.1, mà ExpoModulesJSI của SDK 57 đòi Swift
    # tools 6.2 (Xcode 26) — build sẽ chết ở "Could not resolve package
    # dependencies". Dùng image mới hơn.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Image có thể cài sẵn nhiều bản Xcode; chọn bản cao nhất thay vì tin vào
      # mặc định, để lần sau image đổi cũng không gãy.
      - name: Chọn Xcode mới nhất
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Dùng: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài dependency
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
          npm run test:ios-keyboard

      # Thư mục ios/ nằm trong .gitignore nên phải sinh lại mỗi lần build.
      # --no-install để tự chạy pod install ở bước sau cho dễ đọc log.
      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --no-install

      - name: Cài CocoaPods
        working-directory: ios
        run: pod install --repo-update

      # Scheme phải lấy từ .xcodeproj CỦA APP, không phải từ workspace: danh
      # sách scheme của workspace gộp cả scheme của Pods, và phần tử [0] của nó
      # là một pod (EXConstants) — build cái đó thì ra framework chứ không ra
      # .app, nên bước đóng gói chết mà bước build vẫn báo thành công.
      - name: Dò workspace + scheme
        id: xc
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -project "$PROJ" -list -json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).project.schemes[0]))")
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"  >> "$GITHUB_OUTPUT"
          echo "Workspace: $WS | Project: $PROJ | Scheme: $SCHEME"

      - name: Build .app không ký
        working-directory: ios
        run: |
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # .ipa chỉ là file zip có thư mục Payload/ ở gốc. Tự đóng gói vì
      # `xcodebuild -exportArchive` bắt buộc phải có provisioning profile.
      #
      # Dò .app thay vì ghi cứng Build/Products/Release-iphoneos — vị trí đó
      # thay đổi theo cấu hình, và đoán sai thì bước này chết dù build đã xong.
      - name: Đóng gói thành .ipa
        run: |
          APP=$(find ios/build -type d -name "*.app" \
                  -not -path "*/Index.noindex/*" \
                  -not -path "*.app/*" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Không tìm thấy .app trong ios/build"
            find ios/build -maxdepth 5 -type d | head -60
            exit 1
          fi
          echo "Tìm thấy: $APP"
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Payload
          cp -R "$APP" /tmp/pkg/Payload/
          (cd /tmp/pkg && zip -qry "$GITHUB_WORKSPACE/jetsona-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/jetsona-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          # Kèm mã commit để phân biệt các bản build khi tải nhiều lần.
          name: jetsona-ios-unsigned-${{ github.sha }}
          path: jetsona-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
